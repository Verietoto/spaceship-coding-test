[project]
name = "spaceship-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.50",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "deepagents>=0.7.22",
    "langchain-openai>=1.6.7",
    "langchain-typesafe==0.0.1a3",
    "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
